# Builds the macOS installer on a real Mac, because electron-builder refuses every macOS
# target from Windows ("Build for macOS is supported only on macOS").
#
# Run it from the repository's Actions tab, or by pushing a v* tag. The .dmg appears as a
# downloadable artifact on the finished run.
#
# One caveat worth knowing: a .dmg downloaded from here carries macOS's quarantine flag, and
# on macOS 15+ a quarantined unsigned app can no longer be opened with right-click → Open.
# You have to allow it once under System Settings → Privacy & Security → "Open Anyway".
# Building on your own Mac avoids quarantine altogether, so prefer that when you can.
name: Build macOS installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  dmg:
    # Pinned to the Intel runner on purpose. "macos-latest" now means macOS 15 on Apple
    # Silicon, and arm64 macOS runners are not allocated to free-tier private repos -- the
    # job fails with "not acquired by Runner of type hosted" before it ever starts.
    # Cross-architecture is fine within macOS, so this still builds for Apple Silicon.
    runs-on: macos-13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The merge and auto-fill rules are the parts worth failing a build over.
      - run: npm run test:sync
      - run: npm run test:fill
      - run: npm run test:lookup

      - run: npm run build:web

      # x64 only, not universal. Universal downloads and builds two whole Electron
      # distributions and merges them, which roughly doubles a build that was already the
      # slowest step -- and the target Mac runs Monterey, so it is almost certainly Intel.
      # On Apple Silicon an x64 build still runs, through Rosetta.
      #
      # Verbose, because the previous attempt gave no clue where it was spending its time.
      - name: Build the .dmg
        run: npx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Show what was built
        run: ls -lh release/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Atheneum-macOS
          path: release/*.dmg
          if-no-files-found: error
